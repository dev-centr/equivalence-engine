site:
  title: ≡quivalence Ecosystem Docs
  url: https://dev-centr.github.io/equivalence-engine/docs
  start_page: equivalence-engine:ROOT:index.adoc
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://dev-centr.github.io/equivalence-engine/docs/sitemap.xml
content:
  sources:
    # Only this repo publishes Antora docs today. Sibling repos link out from index.adoc
    # Sibling docs modules live under docs/ in ecosystem repos.
    - url: .
      branches: HEAD
      start_path: docs
ui:
  bundle:
    url: https://github.com/antora-supplemental/antora-dark-theme/releases/download/v1.0.9/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui-overrides

antora:
  extensions:
    - require: '@antora/lunr-extension'
