# Component docs live in docs/; the org hub builds them.
# Canonical: https://docs.devcentr.org/tools/equivalence-engine/
# (wired via https://github.com/dev-centr/docs). No standalone Antora playbook/site.

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Antora component descriptor
        run: |
          set -euo pipefail
          test -f docs/antora.yml
          grep -qE '^name:[[:space:]]*tools' docs/antora.yml
          test -d docs/modules/equivalence-engine
          test -f docs/modules/equivalence-engine/pages/index.adoc
          echo "OK: tools/equivalence-engine Antora module present for docs hub"
